<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="COLP — Agricultural ERP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2410"/>
      <stop offset="100%" stop-color="#2d3a18"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <pattern id="rows" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 22h44" stroke="rgba(132,204,22,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#rows)"/>

  <!-- Glows -->
  <circle cx="540" cy="60" r="120" fill="#84cc16" opacity="0.18"/>
  <circle cx="80" cy="320" r="140" fill="#facc15" opacity="0.12"/>

  <!-- Dashboard card -->
  <g transform="translate(330 150)">
    <rect width="270" height="170" rx="12" fill="url(#card)" stroke="#1c2410" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="32" rx="12" fill="#365314"/>
    <rect x="0" y="20" width="270" height="12" fill="#365314"/>
    <circle cx="16" cy="16" r="4" fill="#facc15"/>
    <circle cx="30" cy="16" r="4" fill="#a3e635"/>
    <circle cx="44" cy="16" r="4" fill="#fef3c7"/>
    <text x="140" y="20" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#ecfccb">DASHBOARD · COLP</text>

    <!-- KPI -->
    <rect x="14" y="46" width="76" height="46" rx="6" fill="#ecfccb" stroke="#bef264"/>
    <text x="52" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#3f6212">CULTIVOS</text>
    <text x="52" y="84" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#365314">128</text>

    <rect x="98" y="46" width="76" height="46" rx="6" fill="#fef9c3" stroke="#fde047"/>
    <text x="136" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#713f12">NÓMINA</text>
    <text x="136" y="84" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#854d0e">42</text>

    <rect x="182" y="46" width="76" height="46" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="220" y="64" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#166534">EQUIPO</text>
    <text x="220" y="84" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#14532d">23</text>

    <!-- bar chart -->
    <g transform="translate(14 104)">
      <rect x="0" y="40" width="14" height="20" fill="#84cc16"/>
      <rect x="20" y="28" width="14" height="32" fill="#84cc16"/>
      <rect x="40" y="14" width="14" height="46" fill="#facc15"/>
      <rect x="60" y="22" width="14" height="38" fill="#84cc16"/>
      <rect x="80" y="6" width="14" height="54" fill="#facc15"/>
      <rect x="100" y="20" width="14" height="40" fill="#84cc16"/>
      <rect x="120" y="32" width="14" height="28" fill="#84cc16"/>
      <rect x="140" y="10" width="14" height="50" fill="#facc15"/>
      <rect x="160" y="24" width="14" height="36" fill="#84cc16"/>
      <rect x="180" y="16" width="14" height="44" fill="#facc15"/>
      <rect x="200" y="34" width="14" height="26" fill="#84cc16"/>
      <rect x="220" y="20" width="14" height="40" fill="#84cc16"/>
      <line x1="0" y1="60" x2="240" y2="60" stroke="#365314" stroke-width="1"/>
    </g>
  </g>

  <!-- Leaf icon -->
  <g transform="translate(70 170)">
    <path d="M0 60 C 0 0, 60 -10, 110 -20 C 110 60, 60 80, 0 60 Z" fill="url(#leaf)"/>
    <path d="M10 56 Q 60 30 100 -10" stroke="#365314" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="40" y="58" font-size="13" letter-spacing="6" fill="url(#acc)">ERP · AGROPECUARIO</text>
    <text x="40" y="100" font-size="34" font-weight="800" fill="#fafaf9">COLP</text>
    <text x="40" y="126" font-size="14" fill="#bef264">Laravel · Vue.js · MySQL</text>
  </g>

  <!-- Chips -->
  <g font-family="JetBrains Mono,Menlo,monospace" font-size="11">
    <g transform="translate(420 28)">
      <rect width="80" height="22" rx="11" fill="rgba(132,204,22,0.15)" stroke="rgba(132,204,22,0.5)"/>
      <text x="40" y="15" text-anchor="middle" fill="#bef264">multi-rol</text>
    </g>
    <g transform="translate(508 28)">
      <rect width="92" height="22" rx="11" fill="rgba(250,204,21,0.15)" stroke="rgba(250,204,21,0.5)"/>
      <text x="46" y="15" text-anchor="middle" fill="#fde68a">CCEO Software</text>
    </g>
  </g>
</svg>
