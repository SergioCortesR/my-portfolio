<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="TransporteBRT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(148,163,184,0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Glow blobs -->
  <circle cx="120" cy="80" r="120" fill="#3b82f6" opacity="0.18"/>
  <circle cx="540" cy="300" r="140" fill="#22d3ee" opacity="0.14"/>

  <!-- Road -->
  <rect x="0" y="240" width="640" height="48" fill="#1e293b"/>
  <g stroke="#fbbf24" stroke-width="4" stroke-dasharray="22 18">
    <line x1="0" y1="264" x2="640" y2="264"/>
  </g>

  <!-- Bus -->
  <g transform="translate(170 168)">
    <rect x="0" y="0" width="300" height="78" rx="10" fill="url(#bus)" stroke="#0f172a" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="34" rx="4" fill="#0ea5e9" opacity="0.85"/>
    <rect x="78" y="10" width="60" height="34" rx="4" fill="#0ea5e9" opacity="0.85"/>
    <rect x="146" y="10" width="60" height="34" rx="4" fill="#0ea5e9" opacity="0.85"/>
    <rect x="214" y="10" width="76" height="34" rx="4" fill="#0ea5e9" opacity="0.85"/>
    <rect x="0" y="56" width="300" height="14" fill="#0f172a"/>
    <rect x="270" y="20" width="14" height="6" fill="#fde68a"/>
    <circle cx="60" cy="78" r="14" fill="#0f172a"/>
    <circle cx="60" cy="78" r="6" fill="#475569"/>
    <circle cx="240" cy="78" r="14" fill="#0f172a"/>
    <circle cx="240" cy="78" r="6" fill="#475569"/>
    <text x="150" y="38" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">BRT</text>
  </g>

  <!-- Title -->
  <g font-family="Inter,Arial,sans-serif" fill="#e2e8f0">
    <text x="40" y="58" font-size="14" letter-spacing="6" fill="url(#accent)">PLATAFORMA · BRT</text>
    <text x="40" y="100" font-size="34" font-weight="800">TransporteBRT</text>
    <text x="40" y="128" font-size="15" fill="#94a3b8">.NET 10 · Angular 20 · SQL Server</text>
  </g>

  <!-- Tag chips -->
  <g font-family="JetBrains Mono,Menlo,monospace" font-size="11">
    <g transform="translate(420 40)">
      <rect width="86" height="22" rx="11" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.5)"/>
      <text x="43" y="15" text-anchor="middle" fill="#67e8f9">REST · API</text>
    </g>
    <g transform="translate(516 40)">
      <rect width="86" height="22" rx="11" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.5)"/>
      <text x="43" y="15" text-anchor="middle" fill="#93c5fd">3 módulos</text>
    </g>
  </g>
</svg>
