<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label=".NET Fútbol API">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e1f"/>
      <stop offset="100%" stop-color="#0b3d2a"/>
    </linearGradient>
    <linearGradient id="acc2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="turf" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="40" fill="rgba(255,255,255,0.025)"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg2)"/>
  <rect width="640" height="360" fill="url(#turf)"/>

  <!-- Field outline -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none">
    <rect x="40" y="60" width="560" height="260" rx="6"/>
    <line x1="320" y1="60" x2="320" y2="320"/>
    <circle cx="320" cy="190" r="48"/>
    <rect x="40" y="120" width="70" height="140"/>
    <rect x="530" y="120" width="70" height="140"/>
  </g>

  <!-- Glow -->
  <circle cx="500" cy="80" r="120" fill="#22c55e" opacity="0.2"/>
  <circle cx="120" cy="300" r="120" fill="#a3e635" opacity="0.15"/>

  <!-- Soccer ball -->
  <g transform="translate(320 190)">
    <circle r="44" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <polygon points="0,-22 19,-7 12,16 -12,16 -19,-7" fill="#0f172a"/>
    <line x1="0" y1="-22" x2="0" y2="-44" stroke="#0f172a" stroke-width="2"/>
    <line x1="19" y1="-7" x2="42" y2="-13" stroke="#0f172a" stroke-width="2"/>
    <line x1="12" y1="16" x2="26" y2="36" stroke="#0f172a" stroke-width="2"/>
    <line x1="-12" y1="16" x2="-26" y2="36" stroke="#0f172a" stroke-width="2"/>
    <line x1="-19" y1="-7" x2="-42" y2="-13" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- Endpoints -->
  <g font-family="JetBrains Mono,Menlo,monospace" font-size="12" fill="#bbf7d0">
    <text x="60" y="350">GET /api/teams</text>
    <text x="240" y="350">POST /api/matches</text>
    <text x="440" y="350">GET /api/players/:id</text>
  </g>

  <!-- Title -->
  <g font-family="Inter,Arial,sans-serif" fill="#ecfdf5">
    <text x="40" y="34" font-size="13" letter-spacing="6" fill="url(#acc2)">.NET · WEB API</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#ffffff">
    <text x="320" y="100" text-anchor="middle" font-size="30" font-weight="800">Fútbol API</text>
    <text x="320" y="124" text-anchor="middle" font-size="14" fill="#bbf7d0">C# · Entity Framework · REST</text>
  </g>
</svg>
