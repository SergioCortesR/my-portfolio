<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Greenfield — School system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1d14"/>
      <stop offset="100%" stop-color="#14322a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(52,211,153,0.12)"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- Glows -->
  <circle cx="540" cy="80" r="120" fill="#10b981" opacity="0.2"/>
  <circle cx="100" cy="300" r="140" fill="#34d399" opacity="0.12"/>

  <!-- Java Swing window mock -->
  <g transform="translate(310 90)">
    <rect width="290" height="220" rx="6" fill="url(#window)" stroke="#0f1d14" stroke-width="2"/>
    <!-- title bar (Java look-and-feel) -->
    <rect x="0" y="0" width="290" height="22" rx="6" fill="#475569"/>
    <rect x="0" y="14" width="290" height="8" fill="#475569"/>
    <circle cx="12" cy="11" r="4" fill="#34d399"/>
    <text x="24" y="15" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="600" fill="#f8fafc">Greenfield · Sistema Escolar</text>
    <rect x="252" y="6" width="10" height="10" fill="#94a3b8"/>
    <rect x="266" y="6" width="10" height="10" fill="#94a3b8"/>
    <rect x="278" y="6" width="6" height="10" fill="#ef4444"/>

    <!-- menu bar -->
    <rect x="0" y="22" width="290" height="20" fill="#e7e5e4"/>
    <text x="10" y="36" font-family="Inter,Arial,sans-serif" font-size="10" fill="#1c1917">Archivo</text>
    <text x="56" y="36" font-family="Inter,Arial,sans-serif" font-size="10" fill="#1c1917">Alumnos</text>
    <text x="106" y="36" font-family="Inter,Arial,sans-serif" font-size="10" fill="#1c1917">Pagos</text>
    <text x="146" y="36" font-family="Inter,Arial,sans-serif" font-size="10" fill="#1c1917">Reportes</text>

    <!-- table header -->
    <rect x="14" y="56" width="262" height="20" fill="#10b981"/>
    <text x="22" y="70" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#f0fdf4">ID</text>
    <text x="64" y="70" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#f0fdf4">ALUMNO</text>
    <text x="160" y="70" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#f0fdf4">GRUPO</text>
    <text x="220" y="70" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#f0fdf4">SALDO</text>

    <!-- rows -->
    <g font-family="Inter,Arial,sans-serif" font-size="9" fill="#1c1917">
      <rect x="14" y="76" width="262" height="18" fill="#fafaf9"/>
      <text x="22" y="88">001</text><text x="64" y="88">Cortés, Sergio</text><text x="160" y="88">3°A</text><text x="220" y="88" fill="#15803d">$0.00</text>
      <rect x="14" y="94" width="262" height="18" fill="#f5f5f4"/>
      <text x="22" y="106">002</text><text x="64" y="106">Miraly, Suzette</text><text x="160" y="106">2°B</text><text x="220" y="106" fill="#b45309">$540.00</text>
      <rect x="14" y="112" width="262" height="18" fill="#fafaf9"/>
      <text x="22" y="124">003</text><text x="64" y="124">Pérez, Ana</text><text x="160" y="124">5°C</text><text x="220" y="124" fill="#15803d">$0.00</text>
      <rect x="14" y="130" width="262" height="18" fill="#f5f5f4"/>
      <text x="22" y="142">004</text><text x="64" y="142">Ramírez, Luis</text><text x="160" y="142">1°A</text><text x="220" y="142" fill="#b91c1c">$1,200</text>
      <rect x="14" y="148" width="262" height="18" fill="#fafaf9"/>
      <text x="22" y="160">005</text><text x="64" y="160">Soto, Jorge</text><text x="160" y="160">4°B</text><text x="220" y="160" fill="#15803d">$0.00</text>
    </g>

    <!-- footer button -->
    <rect x="14" y="180" width="80" height="22" rx="3" fill="#10b981" stroke="#065f46"/>
    <text x="54" y="195" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#f0fdf4">Nuevo pago</text>
    <rect x="100" y="180" width="80" height="22" rx="3" fill="#e7e5e4" stroke="#78716c"/>
    <text x="140" y="195" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#1c1917">Factura</text>
  </g>

  <!-- Java cup icon -->
  <g transform="translate(80 180)">
    <path d="M10 30 H70 V70 Q70 90 40 90 Q10 90 10 70 Z" fill="#fbbf24" stroke="#1c1917" stroke-width="2"/>
    <path d="M70 38 Q90 40 90 56 Q90 72 70 70" fill="none" stroke="#1c1917" stroke-width="3"/>
    <path d="M22 14 Q26 4 32 12 Q26 22 30 28" stroke="#f0fdf4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M40 8 Q44 -2 50 6 Q44 16 48 22" stroke="#f0fdf4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M58 14 Q62 4 68 12 Q62 22 66 28" stroke="#f0fdf4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="40" y="58" font-size="13" letter-spacing="6" fill="url(#acc)">DESKTOP · JAVA</text>
    <text x="40" y="100" font-size="32" font-weight="800" fill="#f0fdf4">Greenfield</text>
    <text x="40" y="124" font-size="14" fill="#86efac">Java · Swing · MySQL</text>
  </g>

  <!-- Chip -->
  <g font-family="JetBrains Mono,Menlo,monospace" font-size="11">
    <g transform="translate(440 28)">
      <rect width="160" height="22" rx="11" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.5)"/>
      <text x="80" y="15" text-anchor="middle" fill="#a7f3d0">administración escolar</text>
    </g>
  </g>
</svg>
