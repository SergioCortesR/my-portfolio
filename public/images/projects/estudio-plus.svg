<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Estudio Plus — Apollo Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(251,146,60,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- Glows -->
  <circle cx="540" cy="80" r="130" fill="#fb923c" opacity="0.22"/>
  <circle cx="100" cy="300" r="140" fill="#f43f5e" opacity="0.16"/>

  <!-- Chalkboard with math -->
  <g transform="translate(310 100)">
    <rect width="290" height="200" rx="10" fill="url(#board)" stroke="#020617" stroke-width="3"/>
    <rect x="-6" y="190" width="302" height="14" rx="3" fill="#a16207"/>

    <!-- Math content -->
    <g font-family="JetBrains Mono,Menlo,monospace" fill="#fef3c7">
      <text x="20" y="40" font-size="20" font-weight="700">∫₀¹ x² dx = 1⁄3</text>
      <text x="20" y="74" font-size="18" fill="#fdba74">a² + b² = c²</text>
      <text x="20" y="108" font-size="18" fill="#fef3c7">π ≈ 3.14159</text>
      <text x="20" y="144" font-size="18" fill="#fdba74">f(x) = 2x + 5</text>
      <text x="20" y="178" font-size="14" fill="#a5f3fc">// 7 × 8 = 56  ✓</text>
    </g>

    <!-- decorative shapes -->
    <g transform="translate(190 30)" stroke="#fdba74" stroke-width="2" fill="none">
      <circle cx="40" cy="40" r="32"/>
      <polygon points="40,12 68,56 12,56"/>
      <rect x="14" y="14" width="52" height="52"/>
    </g>

    <!-- chart -->
    <g transform="translate(180 110)" stroke="#a5f3fc" stroke-width="2" fill="none">
      <path d="M0 60 L20 50 L40 56 L60 30 L80 36 L100 8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="0" y1="60" x2="100" y2="60" stroke="#475569"/>
      <line x1="0" y1="60" x2="0" y2="0" stroke="#475569"/>
    </g>
  </g>

  <!-- Pencil + book -->
  <g transform="translate(60 200)">
    <!-- Book -->
    <rect x="0" y="20" width="100" height="70" rx="4" fill="#fb923c" stroke="#7c2d12" stroke-width="2"/>
    <line x1="50" y1="20" x2="50" y2="90" stroke="#7c2d12" stroke-width="2"/>
    <line x1="10" y1="34" x2="46" y2="34" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="10" y1="44" x2="46" y2="44" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="10" y1="54" x2="42" y2="54" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="54" y1="34" x2="90" y2="34" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="54" y1="44" x2="90" y2="44" stroke="#fef3c7" stroke-width="1.5"/>
    <line x1="54" y1="54" x2="86" y2="54" stroke="#fef3c7" stroke-width="1.5"/>

    <!-- Pencil -->
    <g transform="translate(70 -20) rotate(35)">
      <rect x="0" y="0" width="80" height="14" fill="#fbbf24" stroke="#7c2d12" stroke-width="1.5"/>
      <polygon points="80,0 96,7 80,14" fill="#fef3c7" stroke="#7c2d12" stroke-width="1.5"/>
      <polygon points="92,5 96,7 92,9" fill="#1e293b"/>
      <rect x="-12" y="0" width="14" height="14" fill="#f43f5e" stroke="#7c2d12" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Title -->
  <g font-family="Inter,Arial,sans-serif">
    <text x="40" y="58" font-size="13" letter-spacing="6" fill="url(#acc)">EDU · MATEMÁTICAS</text>
    <text x="40" y="100" font-size="32" font-weight="800" fill="#fef3c7">Estudio Plus</text>
    <text x="40" y="124" font-size="14" fill="#fdba74">React · Node.js · MongoDB</text>
  </g>

  <!-- Chip -->
  <g font-family="JetBrains Mono,Menlo,monospace" font-size="11">
    <g transform="translate(420 28)">
      <rect width="180" height="22" rx="11" fill="rgba(251,146,60,0.18)" stroke="rgba(251,146,60,0.55)"/>
      <text x="90" y="15" text-anchor="middle" fill="#fed7aa">Apollo Solutions · K-12</text>
    </g>
  </g>
</svg>
